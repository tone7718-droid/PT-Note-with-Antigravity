name: CI

# 푸시 / PR 마다 lint + 타입 검사 + Vitest + 정적 빌드 검증.
# 빌드 산출물로 실제 브라우저의 초안·복구·이력 흐름까지 검사합니다.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
